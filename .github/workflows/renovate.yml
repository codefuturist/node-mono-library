# Self-hosted Renovate Bot
# Runs on schedule to check for dependency updates
# https://github.com/renovatebot/github-action
#
# Token Setup (required):
#   1. Create Classic PAT at https://github.com/settings/tokens
#   2. Scopes needed: repo, workflow (Fine-grained tokens NOT supported)
#   3. Add as repository secret: gh secret set RENOVATE_TOKEN
#
# Testing Schedule: Every 15 minutes (change to weekly after validation)

name: Renovate

on:
  # TESTING: Every 15 minutes - change to weekly after validation
  # Production: cron: "0 8 * * 1"  (Weekly on Monday 8am UTC)
  schedule:
    - cron: "*/15 * * * *"

  # Manual trigger with options
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Dry-run mode"
        required: false
        default: "null"
        type: choice
        options:
          - "null"      # Normal run - creates PRs
          - extract     # Only extract dependencies, no PRs
          - lookup      # Extract + lookup versions, no PRs
          - full        # Full run simulation, no PRs
      log-level:
        description: "Log level"
        required: false
        default: "info"
        type: choice
        options:
          - debug
          - info
          - warn
      reset-cache:
        description: "Reset repository cache"
        required: false
        default: false
        type: boolean

# Prevent concurrent runs
concurrency:
  group: renovate-${{ github.repository }}
  cancel-in-progress: false

env:
  # Renovate cache directory
  RENOVATE_CACHE_DIR: /tmp/renovate-cache

jobs:
  renovate:
    name: Renovate
    runs-on: ubuntu-latest
    # Only run on main repo, not forks
    if: github.repository == 'codefuturist/node-mono-library'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Restore cache from previous run
      - name: Restore Renovate cache
        if: inputs.reset-cache != true
        uses: actions/cache@v4
        with:
          path: ${{ env.RENOVATE_CACHE_DIR }}
          key: renovate-cache-${{ github.run_id }}
          restore-keys: |
            renovate-cache-

      - name: Create cache directory
        run: mkdir -p ${{ env.RENOVATE_CACHE_DIR }}

      - name: Run Renovate
        uses: renovatebot/github-action@v44.2.5
        with:
          configurationFile: renovate.json
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          # Log level from input or default
          LOG_LEVEL: ${{ inputs.log-level || 'info' }}
          # Dry-run mode (null = normal run)
          RENOVATE_DRY_RUN: ${{ inputs.dry-run || 'null' }}
          # Disable onboarding PR (we already have config)
          RENOVATE_ONBOARDING: "false"
          # Config is optional (we provide it)
          RENOVATE_REQUIRE_CONFIG: "optional"
          # Enable repository cache for faster runs
          RENOVATE_REPOSITORY_CACHE: "enabled"
          # Cache directory
          RENOVATE_CACHE_DIR: ${{ env.RENOVATE_CACHE_DIR }}

      # Save cache for next run
      - name: Save Renovate cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.RENOVATE_CACHE_DIR }}
          key: renovate-cache-${{ github.run_id }}
