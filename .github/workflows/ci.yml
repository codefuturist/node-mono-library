name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  CI: true

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Required for --affected to work correctly

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 25
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build affected packages
        run: pnpm turbo run build --affected

      - name: Lint affected packages
        run: pnpm turbo run lint --affected

      - name: Type check affected packages
        run: pnpm turbo run check-types --affected

      - name: Test affected packages
        run: pnpm turbo run test --affected

      - name: Upload coverage reports
        uses: codecov/codecov-action@v6
        if: always()
        with:
          directory: ./packages/utils/coverage
          fail_ci_if_error: false

  # Optional: Run full build on main branch
  full-build:
    name: Full Build (main only)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 25
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Full build
        run: pnpm turbo run build lint check-types test

      - name: Build summary
        run: pnpm turbo run build --summarize

  # Validate dependency update configs when they change
  validate-deps-config:
    name: Validate Dependency Configs
    runs-on: ubuntu-latest
    if: |
      contains(github.event.head_commit.modified, '.config/renovate.json') ||
      contains(github.event.head_commit.modified, 'dependabot.yml') ||
      github.event_name == 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate Renovate config
        run: |
          docker run --rm -v $(pwd):/usr/src/app:ro \
            renovate/renovate:latest renovate-config-validator --file=.config/renovate.json

      - name: Validate Dependabot config
        run: |
          python3 -c "import yaml; yaml.safe_load(open('.github/dependabot.yml')); print('✅ Dependabot config valid')"
