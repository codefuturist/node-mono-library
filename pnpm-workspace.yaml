packages:
  - "apps/*"
  - "packages/*"
  - "examples/*"

# Centralized dependency versions for the monorepo
# Use `catalog:` protocol in package.json to reference these versions
# Example: "typescript": "catalog:"
catalog:
  # TypeScript & Build Tools
  typescript: "^5.9.3"
  tsup: "^8.5.1"

  # Testing
  vitest: "^4.1.10"
  "@vitest/coverage-v8": "^4.1.10"

  # Linting & Formatting
  eslint: "^9.39.5"
  prettier: "^3.9.6"
  eslint-config-prettier: "^10.1.8"
